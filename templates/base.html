<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Sales Report Automation{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body><header class="dit-header">
    <img src="{{ url_for('static', filename='dit_icon.jpg') }}"
         alt="DIT Logo"
         class="dit-icon">

    <img src="{{ url_for('static', filename='dit_banner.png') }}"
         alt="DefineInfoTech Banner"
         class="dit-banner">
</header>
<header class="topbar">
  <a class="brand" href="{{ url_for('home') }}">Sales<span>Flow</span></a>
  <nav><a href="{{ url_for('home') }}">Home</a><a href="{{ url_for('dashboard') }}">Dashboard</a><a href="{{ url_for('about') }}">About</a></nav>
</header>
<main class="container">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}{% for category, message in messages %}<div class="alert {{ category }}">{{ message }}</div>{% endfor %}{% endif %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
<footer>DIT-P05 · Sales Report Automation · Team T05</footer>
</body></html>
